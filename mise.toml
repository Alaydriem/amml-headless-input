[env]
_.file = ".env"

[tasks.preflight]
description = "Names a missing toolchain or tool before a build turns it into an obscure error"
dir = "{{config_root}}"
run = [
  "rustc --version",
  "cargo --version",
  "cargo nextest --version",
]

[tasks.check]
description = "Compiles, runs clippy with warnings denied and checks formatting"
dir = "{{config_root}}"
run = [
  "cargo check --workspace --all-targets",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo fmt --all --check",
]

[tasks.test]
description = "Every test through cargo nextest run"
dir = "{{config_root}}"
run = "cargo nextest run --workspace"

[tasks.package]
description = "Builds dist/@alaydriem/headless-input/ (alaydriem_headless_input.dll, amml.hcl), the release artifact"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -e
cargo build --release -p headless-input-amml
rm -rf dist/@alaydriem/headless-input
mkdir -p dist/@alaydriem/headless-input
cp target/release/alaydriem_headless_input.dll dist/@alaydriem/headless-input/alaydriem_headless_input.dll
cp src/amml/amml.hcl dist/@alaydriem/headless-input/amml.hcl
cp src/amml/icon.png dist/@alaydriem/headless-input/icon.png
if find dist -name '*.pdb' | grep -q .; then echo "a .pdb is in dist/; debug symbols are never shipped"; exit 1; fi
echo "built dist/@alaydriem/headless-input"
'''

[tasks.install]
description = "Runs package, then copies dist/@alaydriem/headless-input into mods/amml/@alaydriem/headless-input of an AMML instance under %LOCALAPPDATA%/amml/instances (--instance, required). The mod's config/ stays. Close the game first: a running game locks the DLL"
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--instance <name>" required=#true help="The instance folder under %LOCALAPPDATA%/amml/instances"
'''
run = '''
set -e
[ -n "$LOCALAPPDATA" ] || { echo "LOCALAPPDATA is not set; the instances live under %LOCALAPPDATA%/amml/instances"; exit 1; }
name="${usage_instance:-}"
[ -n "$name" ] || { echo "--instance <name> is required"; exit 1; }
lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
instances="$(cd "$LOCALAPPDATA/amml/instances" 2> /dev/null && pwd -P)" || { echo "no folder $LOCALAPPDATA/amml/instances"; exit 1; }
instance="$(cd "$instances/$name" 2> /dev/null && pwd -P)" || { echo "no instance folder $instances/$name"; exit 1; }
[ "$(lower "$(dirname "$instance")")" = "$(lower "$instances")" ] || { echo "refusing $name: it resolves to $instance, which is not a folder of $instances"; exit 1; }
case "$(lower "$(basename "$instance")")" in
  1.26.63.01|1.26.63.01-p) echo "refusing $name: it resolves to $instance, a play instance; install into a test instance"; exit 1 ;;
esac
[ -f "$instance/Minecraft.Windows.exe" ] || { echo "no instance at $instance"; exit 1; }
mise run package
target="$instance/mods/amml/@alaydriem/headless-input"
mkdir -p "$target"
cp -r dist/@alaydriem/headless-input/. "$target/"
echo "installed dist/@alaydriem/headless-input -> $target"
'''
[tasks."mcp:connect"]
description = "Pairs Claude Code with the headless-input MCP hub. It needs HEADLESS_MODS_DIR in .env (copy .env.example) and the MCP server on in the headless-input settings of a running game"
dir = "{{config_root}}"
run = "cargo run -q -j 4 -p headless-input-mcp --bin headless_pair"

[tasks.manifest]
description = "Rewrites the uses block of src/amml/amml.hcl from the USES of the mod"
dir = "{{config_root}}"
run = "cargo run -q -p headless-input-amml --example write_manifest"


[tasks.compat]
description = "Runs the AMML compat check of the packaged mod in dist/ against a game exe (--exe, required): which events and areas of the mod this build serves. Run package first"
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--exe <exe>" required=#true help="The Minecraft.Windows.exe of a test instance"
'''
run = '''
set -e
mise --cd ../amml run compat -- --exe "${usage_exe:?--exe is required}" --mods "$PWD/dist"
'''

