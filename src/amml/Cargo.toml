[package]
name = "headless-input-amml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
name = "alaydriem_headless_input"
crate-type = ["cdylib", "rlib"]

[features]
# Test builds only (the in-game proof script): a pairing request is allowed without the pairing switch.
ingame-proof = []

[dependencies]
headless-input-core.workspace = true
headless-input-mcp.workspace = true
amml-api.workspace = true
amm-client.workspace = true
amm-core.workspace = true
curia.workspace = true
hcl-rs.workspace = true
serde.workspace = true
image = { version = "=0.25.6", default-features = false, features = ["png"] }
thiserror = "2"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "time"] }

[dev-dependencies]
amml-api = { workspace = true, features = ["test"] }
amm-client = { workspace = true, features = ["test-support"] }
amm-core.workspace = true
tempfile = "=3.27.0"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[example]]
name = "write_manifest"
path = "examples/write_manifest.rs"

[lints]
workspace = true
