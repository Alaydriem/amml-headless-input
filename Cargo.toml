[workspace]
resolver = "3"
members = ["src/core", "src/mcp", "src/amml"]

[workspace.package]
version = "26.63.4"
edition = "2024"
rust-version = "1.98"
authors = ["Charles R. Portwood II"]
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
amm-abi = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.63.4" }
amm-client = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.63.4", default-features = false }
amm-core = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.63.4" }
amml-sdk = { git = "https://github.com/Alaydriem/amml.git", tag = "26.63.4" }
amml-game = { git = "https://github.com/Alaydriem/amml.git", tag = "26.63.4" }
amml-msvc = { git = "https://github.com/Alaydriem/amml.git", tag = "26.63.4" }
curia = "=0.2.2"
hcl-rs = "=0.19.8"
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "=0.6.5"
headless-input-core = { path = "src/core" }
headless-input-mcp = { path = "src/mcp" }

# Temporary: the manager's send_move (ABI 2.4) exists only in the local checkout. Remove when a manager tag ships it.
[patch."https://github.com/Alaydriem/amml-modmanager.git"]
amm-abi = { path = "../modmanager/crates/amm-abi" }
amm-client = { path = "../modmanager/crates/amm-client" }
amm-core = { path = "../modmanager/crates/amm-core" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Tests build in the dev profile. Unoptimized, the screenshot decode, scale and encode take seconds and pass the
# test deadlines on slow CI runners. Release builds are not changed.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3
