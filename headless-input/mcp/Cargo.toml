[package]
name = "headless-input-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
headless-input-core.workspace = true
curia.workspace = true
hcl-rs.workspace = true
serde.workspace = true
socket2.workspace = true
rmcp = { version = "=3.1.2", default-features = false, features = ["server", "transport-streamable-http-server", "macros"] }
# Same major as rmcp's own schemars, so the derives match rmcp's JsonSchema trait.
schemars = "=1.2.3"
serde_json = "=1.0.154"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-util = "=0.7.19"
axum = { version = "=0.8.9", default-features = false, features = ["tokio", "http1", "json", "query"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["query"] }
# Constant-time compare for the bearer token.
subtle = "=2.6.1"
getrandom = "=0.3.4"

[dev-dependencies]
rmcp = { version = "=3.1.2", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "=3.27.0"

[[bin]]
name = "headless_pair"
path = "src/bin/headless_pair.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
